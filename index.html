  <style>
    :root { --ink:#172018; --paper:#f5f1e8; --coral:#ef6a57; --lime:#d7f16a; --mist:#e8e4d9; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"DM Sans",sans-serif; color:var(--ink); }
    .display { font-family:"Fraunces",serif; }
    .grain { background-image:radial-gradient(rgba(23,32,24,.14) .7px, transparent .7px); background-size:8px 8px; }
    .reveal { animation: rise .6s both; }
    @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    .challenge-card { transition:transform .2s ease, box-shadow .2s ease; }
    .challenge-card:hover { transform:translateY(-3px); box-shadow:0 16px 30px rgba(23,32,24,.09); }
    button:focus-visible, input:focus-visible { outline:3px solid #ef6a57; outline-offset:3px; }
    .progress-fill { transition:width .45s ease; }
  </style>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js" type="text/javascript"></script>
 <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

 <body data-template-id="__page-root" class="w-full min-h-screen">

       </div>
       <div class="rounded-xl bg-[#f5f1e8] p-3"><span class="block text-xs font-bold uppercase tracking-wide">Ends</span><strong id="challenge-end-date" class="mt-1 block text-sm">2027-01-09</strong>

        <div class="grid grid-cols-2 gap-3">
         <div>

  <div id="delete-dialog" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#172018]/70 p-5" role="dialog" aria-modal="true" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-copy">
   <div class="w-full max-w-md rounded-2xl bg-[#f5f1e8] p-6 shadow-2xl">
    <h2 id="delete-dialog-title" data-template-id="delete-dialog-title" class="canva-text display text-2xl font-bold">Delete goal?</h2>
    <p id="delete-dialog-copy" data-template-id="delete-dialog-copy" class="canva-text mt-3 leading-relaxed">This will remove the selected goal, its future schedule, and all associated check-in history. This cannot be undone.</p>
    <p id="delete-dialog-goal" class="mt-3 rounded-lg bg-[#e8e4d9] p-3 font-bold" aria-live="polite"></p>
    <div class="mt-5 flex flex-wrap justify-end gap-2">
     <button id="delete-cancel-button" data-template-id="delete-cancel-button" class="canva-button rounded-xl border-2 border-[#172018] px-4 py-3 font-bold" type="button">Cancel</button><button id="delete-confirm-button" data-template-id="delete-confirm-button" class="canva-button rounded-xl bg-[#ef6a57] px-4 py-3 font-bold" type="button">Delete goal</button>
    </div>
   </div>
  </div>
  <template id="challenge-template">
   <article data-template-id="challenge-card" class="canva-card challenge-card rounded-[1.5rem] border-2 border-[#172018] p-5">
    <div class="flex items-start justify-between gap-3">
     <div>
      <p class="record-name text-sm font-bold uppercase tracking-wider"></p>
      <h3 class="record-goal display mt-1 text-2xl font-bold leading-tight"></h3>
      <p class="record-description mt-2 text-sm"></p>
      <p class="record-start mt-2 text-xs font-bold uppercase tracking-wide"></p>
     </div><span class="record-days rounded-full bg-[#d7f16a] px-3 py-1 text-sm font-bold"></span>
    </div>
    <div class="mt-5 flex items-center justify-between gap-3 text-sm font-bold"><span class="record-schedule"></span><span class="record-progress-label" aria-live="polite"></span>
    </div>
    <div class="mt-2 h-3 overflow-hidden rounded-full bg-[#e8e4d9]" role="progressbar" aria-label="Goal progress">
     <div class="progress-fill h-full rounded-full bg-[#ef6a57]"></div>
    </div>
    <p class="record-due mt-2 text-xs font-bold"></p>
    <div class="mt-4 grid grid-cols-3 gap-2 text-center text-sm">
     <div class="rounded-lg bg-[#f5f1e8] p-2"><strong class="record-done block text-lg"></strong><span>done</span>
     </div>
     <div class="rounded-lg bg-[#f5f1e8] p-2"><strong class="record-best block text-lg"></strong><span>best</span>
     </div>
     <div class="rounded-lg bg-[#f5f1e8] p-2"><strong class="record-bare block text-lg"></strong><span>minimum</span>
     </div>
    </div>
    <div class="record-actions mt-5 grid grid-cols-2 gap-2">
     <button data-template-id="edit-button" class="canva-button col-span-2 rounded-xl border-2 border-[#172018] px-3 py-2 text-sm font-bold" type="button">Edit goal</button><button data-template-id="delete-button" class="canva-button col-span-2 rounded-xl border-2 border-[#ef6a57] px-3 py-2 text-sm font-bold" type="button">Delete goal</button><button data-template-id="best-button" class="canva-button rounded-xl px-3 py-3 text-sm font-bold disabled:opacity-50" type="button"><span data-template-id="best-button-text" class="canva-text"></span></button> <button data-template-id="bare-button" class="canva-button rounded-xl px-3 py-3 text-sm font-bold disabled:opacity-50" type="button"><span data-template-id="bare-button-text" class="canva-text"></span></button>
    </div>
   </article>
  </template>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDd_bG0smMyKmd29LYX8ij47ncweArT4U78",
  authDomain: "days-challenge-23c74.firebaseapp.com",
  projectId: "days-challenge-23c74",
  storageBucket: "days-challenge-23c74.firebasestorage.app",
  messagingSenderId: "29569666523",
  appId: "1:29569666523:web:695fee2ae755168c586bfe",
  measurementId: "G-PM1DG5WWS"
};
const START_DATE = "2026-10-02";
const CANONICAL_CHALLENGE_ID = "100-day-adoption-challenge-2026";
const PARTICIPANT_SESSION_KEY = "100-day-challenge-participant-session";
let db, auth, currentUser = null, backendRecords = [], participantId = "", activeName = "";

const COPY = {
  "site-title":"THE 100", "start-pill-text":"Begins 2 October 2026",
  "eyebrow":"A SHARED RESET", "hero-title":"Make the next 100 days count.",
  "hero-description":"Pick one meaningful goal. Log the days you showed up at your best — and the days you simply did the minimum. Both move you forward.",
  "join-title":"Claim your challenge", "join-copy":"Your challenge starts tomorrow. Keep the goal specific enough that you will know when you have done it.",
  "name-label":"Your name", "goal-label":"Your 100-day goal", "description-label":"Goal description (What will this goal change?)", "start-date-label":"Goal start date",
  "best-definition-label":"Best-version definition (What does your highest-level success look like?)", "bare-definition-label":"Bare-minimum definition (What is the smallest acceptable version?)", "frequency-label":"Frequency",
  "custom-interval-label":"How often do you want this goal to repeat?", "target-label-text":"Total number of times the goal should be completed", "create-button":"Start my 100 days",
  "edit-goal-heading":"Edit goal", "edit-goal-help":"Changes apply to your future schedule; your completed history stays unchanged.",
  "edit-title-label":"Goal title", "edit-description-label":"Description", "edit-start-label":"Start date", "edit-best-label":"Best-version definition",
  "edit-bare-label":"Bare-minimum definition", "edit-frequency-label":"Frequency", "edit-interval-label":"Interval days", "edit-target-label":"Target completions",
  "shared-note":"Your goal is shared with the challenge community. Anonymous sign-in keeps your browser connected to your goals without requiring a password.",
  "my-kicker":"YOUR SPACE", "my-title":"My challenge", "load-text":"Loading the shared challenge…", "personal-empty-text":"You haven’t added a goal yet. Start with one small, specific commitment.",
  "retry-button-label":"Try again", "community-kicker":"THE COLLECTIVE", "community-title":"Other participants", "community-copy":"See public goals, check-ins, streaks, and progress from other participants.",
  "stat-people-label":"people", "stat-days-label":"days done", "stat-best-label":"best days", "community-empty-text":"No other public activity yet. Shared goals and progress will appear here when someone else joins or shares an update.",
  "delete-dialog-title":"Delete goal?", "delete-dialog-copy":"This will remove the selected goal and its check-in history. This cannot be undone.",
  "delete-cancel-button":"Cancel", "delete-confirm-button":"Delete goal", "edit-button":"Edit goal", "delete-button":"Delete goal",
  "best-button-text":"Check in — best", "bare-button-text":"Check in — minimum"
};

function setCopy(){
  Object.entries(COPY).forEach(([id,text])=>{const el=document.querySelector(`[data-template-id="${id}"]`); if(el && el.tagName!=='INPUT' && el.tagName!=='TEXTAREA') el.textContent=text;});
  document.querySelectorAll('[data-template-id="name-input"],[data-template-id="goal-input"]').forEach(el=>el.placeholder='');
  document.getElementById('goal-description').placeholder='What does this goal mean in practice?';
  document.getElementById('best-definition').placeholder='What does your best version look like?';
  document.getElementById('bare-definition').placeholder='What counts when life gets messy?';
}
function restoreSession(){try{const s=JSON.parse(localStorage.getItem(PARTICIPANT_SESSION_KEY)||'null');if(s){participantId=s.participantId||'';activeName=s.displayName||'';}}catch(e){}}
function saveSession(){try{localStorage.setItem(PARTICIPANT_SESSION_KEY,JSON.stringify({participantId,displayName:activeName}));}catch(e){}}
function dateOnly(v){const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d)}
function formatDateOnly(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function challengeEndDate(){const d=dateOnly(START_DATE);d.setDate(d.getDate()+99);return d}
function daysLeft(){const t=new Date();t.setHours(0,0,0,0);return Math.max(0,Math.min(100,Math.floor((challengeEndDate()-t)/86400000)+1))}
function updateChallengeSummary(){const s=dateOnly(START_DATE),e=challengeEndDate(),t=new Date();t.setHours(0,0,0,0);document.getElementById('challenge-current-day').textContent=Math.min(100,Math.max(1,Math.floor((t-s)/86400000)+1));document.getElementById('challenge-start-date').textContent=START_DATE;document.getElementById('challenge-end-date').textContent=formatDateOnly(e);document.getElementById('challenge-days-left').textContent=daysLeft()}
function targetFor(r){if(Number(r.target_completions)>0)return Number(r.target_completions);const i=r.frequency==='weekly'?7:Math.max(1,Number(r.custom_interval_days)||1);return r.frequency==='weekly'?20:Math.ceil(100/i)}
function nextDueFor(r){const i=r.frequency==='weekly'?7:Math.max(1,Number(r.custom_interval_days)||1);const start=new Date((r.start_date||START_DATE)+'T00:00:00');return new Date(start.getTime()+(Number(r.days_done)||0)*i*86400000).toISOString().slice(0,10)}
function keyFor(r){return r.id||r.goal_id}
function latestChallenges(records){return [...records].sort((a,b)=>{const da=Number(a.updated_at||0),db=Number(b.updated_at||0);return db-da})}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.add('hidden'),3500)}
function setSyncStatus(msg,show=true){const el=document.getElementById('sync-status');el.textContent=msg;el.classList.toggle('hidden',!show)}
function isMine(r){return currentUser && r.participant_id===currentUser.uid}

function buildCard(record,personal){
  const node=document.getElementById('challenge-template').content.cloneNode(true); const card=node.querySelector('article'); card.dataset.key=keyFor(record);
  card.querySelector('.record-name').textContent=record.display_name||'Anonymous participant';
  card.querySelector('.record-goal').textContent=record.goal_title||'No goal shared yet';
  card.querySelector('.record-description').textContent=record.goal_description||'No description yet.';
  card.querySelector('.record-start').textContent='Starts '+(record.start_date||START_DATE);
  const target=targetFor(record),done=Number(record.days_done)||0,percent=Math.min(100,Math.round(done/target*100));
  card.querySelector('.record-days').textContent=daysLeft()+' left';
  card.querySelector('.record-schedule').textContent=(record.frequency||'daily')+' · target '+target+' · '+Math.max(0,target-done)+' remaining';
  card.querySelector('.record-progress-label').textContent=done+' of '+target+' completed ('+percent+'%)';
  card.querySelector('.record-due').textContent='Next due: '+nextDueFor(record)+' · Streak: '+(Number(record.current_streak)||0)+' · '+(record.recent_update||'No updates yet.');
  card.querySelector('.progress-fill').style.width=percent+'%';card.querySelector('.record-done').textContent=done;card.querySelector('.record-best').textContent=record.best_version_days||0;card.querySelector('.record-bare').textContent=record.bare_minimum_days||0;
  const actions=card.querySelector('.record-actions');
  if(!personal){actions.remove()} else {
    card.querySelector('[data-template-id="edit-button"]').addEventListener('click',()=>openEditForm(record));
    card.querySelector('[data-template-id="delete-button"]').addEventListener('click',()=>openDeleteDialog(record));
    const b=card.querySelector('[data-template-id="best-button"]'),m=card.querySelector('[data-template-id="bare-button"]');
    b.disabled=done>=target;m.disabled=done>=target;
    b.addEventListener('click',e=>checkIn(record,'best',e.currentTarget));m.addEventListener('click',e=>checkIn(record,'bare',e.currentTarget));
  }
  return card;
}
function syncList(list,records,personal){list.replaceChildren();records.forEach(r=>list.appendChild(buildCard(r,personal)))}
function render(){
  const latest=latestChallenges(backendRecords), personal=latest.filter(isMine), others=latest.filter(r=>!isMine(r)&&r.is_shareable!==false);
  document.getElementById('load-state').classList.add('hidden');document.getElementById('load-error').classList.add('hidden');
  document.getElementById('personal-empty').classList.toggle('hidden',personal.length>0);document.getElementById('personal-count').textContent=personal.length;
  syncList(document.getElementById('personal-list'),personal,true);syncList(document.getElementById('community-list'),others,false);
  document.getElementById('community-empty').classList.toggle('hidden',others.length>0);
  document.getElementById('stat-people').textContent=new Set(others.map(r=>r.participant_id)).size;
  document.getElementById('stat-days').textContent=others.reduce((s,r)=>s+(Number(r.days_done)||0),0);
  document.getElementById('stat-best').textContent=others.reduce((s,r)=>s+(Number(r.best_version_days)||0),0);
  document.getElementById('collective-status').textContent='Live · updated '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
}
function showLoadError(msg){document.getElementById('load-state').classList.add('hidden');document.getElementById('load-error').classList.remove('hidden');document.querySelector('[data-template-id="error-text"]').textContent=msg}

async function initFirebase(){
  try{
    const app=firebase.initializeApp(firebaseConfig); db=firebase.firestore(); auth=firebase.auth();
    await auth.signInAnonymously(); currentUser=auth.currentUser; participantId=currentUser.uid; saveSession();
    db.collection('goals').where('challenge_id','==',CANONICAL_CHALLENGE_ID).onSnapshot(snap=>{
      backendRecords=snap.docs.map(d=>({id:d.id,...d.data()}));render();setSyncStatus('Saved and synced.',false);
    },err=>{console.error(err);showLoadError('Could not load the shared challenge board. Check the Firebase connection and try again.');});
  }catch(err){console.error(err);showLoadError('Firebase could not connect. Please refresh and try again.');}
}
async function createGoal(data,button){button.disabled=true;setSyncStatus('Saving…');try{const id=currentUser.uid+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);await db.collection('goals').doc(id).set(data);activeName=data.display_name;saveSession();showToast('Your goal is on the board.');document.getElementById('challenge-form').reset();document.getElementById('goal-start-date').value=START_DATE;setSyncStatus('Saved and synced.');}catch(e){console.error(e);showToast('Could not save your goal. Please try again.');setSyncStatus('Save failed — please retry.')}finally{button.disabled=false}}

document.getElementById('challenge-form').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('display-name').value.trim(),goal=document.getElementById('goal-title').value.trim(),description=document.getElementById('goal-description').value.trim(),start=document.getElementById('goal-start-date').value||START_DATE,best=document.getElementById('best-definition').value.trim(),bare=document.getElementById('bare-definition').value.trim(),frequency=document.getElementById('goal-frequency').value,interval=Number(document.getElementById('custom-interval').value)||1,target=Number(document.getElementById('target-completions').value)||0;if(!name||!goal||!best||!bare)return showToast('Complete your name, goal title, and both completion definitions.');if(frequency==='custom'&&interval<1&&!target)return showToast('Add a custom interval or target completion count.');const button=e.submitter;const expected=target|| (frequency==='daily'?100:Math.ceil(100/(frequency==='weekly'?7:interval)));createGoal({display_name:name,participant_id:currentUser.uid,challenge_id:CANONICAL_CHALLENGE_ID,goal_title:goal,goal_id:currentUser.uid+'_'+Date.now(),start_date:start,days_done:0,best_version_days:0,bare_minimum_days:0,goal_description:description,best_version_definition:best,bare_minimum_definition:bare,frequency,custom_interval_days:frequency==='weekly'?7:interval,target_completions:target,expected_completions:expected,remaining_completions:expected,next_due_date:start,due_date:start,current_streak:0,completion_status:'not_started',is_shareable:true,recent_update:'Goal joined the challenge',created_at:Date.now(),updated_at:Date.now()},button)});

function openEditForm(r){const f=document.getElementById('edit-goal-form');document.getElementById('edit-goal-key').value=r.id;document.getElementById('edit-goal-title-input').value=r.goal_title||'';document.getElementById('edit-description-input').value=r.goal_description||'';document.getElementById('edit-start-input').value=r.start_date||START_DATE;document.getElementById('edit-best-input').value=r.best_version_definition||'';document.getElementById('edit-bare-input').value=r.bare_minimum_definition||'';document.getElementById('edit-frequency-input').value=r.frequency||'daily';document.getElementById('edit-interval-input').value=r.custom_interval_days||1;document.getElementById('edit-target-input').value=r.target_completions||'';f.classList.remove('hidden');f.scrollIntoView({behavior:'smooth',block:'nearest'})}
let deleteTarget=null;function openDeleteDialog(r){deleteTarget=r;document.getElementById('delete-dialog-goal').textContent=(r.goal_title||'Goal')+' — '+(r.display_name||'');const d=document.getElementById('delete-dialog');d.classList.remove('hidden');d.classList.add('flex')}
function closeDeleteDialog(){deleteTarget=null;const d=document.getElementById('delete-dialog');d.classList.add('hidden');d.classList.remove('flex')}
async function deleteGoal(){if(!deleteTarget)return;const b=document.getElementById('delete-confirm-button');b.disabled=true;try{await db.collection('goals').doc(deleteTarget.id).delete();closeDeleteDialog();document.getElementById('edit-goal-form').classList.add('hidden');showToast('Goal deleted.')}catch(e){console.error(e);showToast('Could not delete this goal.')}finally{b.disabled=false}}
async function checkIn(r,type,b){const target=targetFor(r),done=Number(r.days_done)||0;if(done>=target)return showToast('This goal has reached its target.');const due=new Date(nextDueFor(r)+'T00:00:00');if(new Date()<due)return showToast('This goal is not due yet. Next due: '+nextDueFor(r));b.disabled=true;setSyncStatus('Saving…');const nextDone=done+1;try{await db.collection('goals').doc(r.id).update({days_done:nextDone,best_version_days:(Number(r.best_version_days)||0)+(type==='best'?1:0),bare_minimum_days:(Number(r.bare_minimum_days)||0)+(type==='bare'?1:0),last_check_in:new Date().toISOString(),check_in_date:new Date().toISOString().slice(0,10),current_streak:(Number(r.current_streak)||0)+1,remaining_completions:Math.max(0,target-nextDone),next_due_date:nextDueFor({...r,days_done:nextDone}),due_date:nextDueFor({...r,days_done:nextDone}),completion_status:nextDone>=target?'complete':'in_progress',recent_update:type==='best'?'Checked in at best version':'Checked in at bare minimum',updated_at:Date.now()});showToast(type==='best'?'Best-version day saved. Keep going.':'Bare-minimum day saved. Showing up counts.');setSyncStatus('Saved and synced.')}catch(e){console.error(e);showToast('Could not save the check-in.')}finally{b.disabled=false}}

document.getElementById('edit-cancel-button').addEventListener('click',()=>document.getElementById('edit-goal-form').classList.add('hidden'));
document.getElementById('edit-delete-button').addEventListener('click',()=>{const r=backendRecords.find(x=>x.id===document.getElementById('edit-goal-key').value);if(r)openDeleteDialog(r)});
document.getElementById('delete-cancel-button').addEventListener('click',closeDeleteDialog);document.getElementById('delete-confirm-button').addEventListener('click',deleteGoal);
document.getElementById('retry-button').addEventListener('click',()=>location.reload());document.getElementById('add-goal-button').addEventListener('click',()=>document.getElementById('challenge-form').scrollIntoView({behavior:'smooth',block:'center'}));
document.getElementById('edit-goal-form').addEventListener('submit',async e=>{e.preventDefault();const id=document.getElementById('edit-goal-key').value,r=backendRecords.find(x=>x.id===id);if(!r||!isMine(r))return showToast('That goal is no longer available.');const frequency=document.getElementById('edit-frequency-input').value,interval=Math.max(1,Number(document.getElementById('edit-interval-input').value)||1),target=Math.max(0,Number(document.getElementById('edit-target-input').value)||0),nextTarget=target||(frequency==='daily'?100:Math.ceil(100/(frequency==='weekly'?7:interval))),b=e.submitter;b.disabled=true;try{await db.collection('goals').doc(id).update({goal_title:document.getElementById('edit-goal-title-input').value.trim(),goal_description:document.getElementById('edit-description-input').value.trim(),start_date:document.getElementById('edit-start-input').value,best_version_definition:document.getElementById('edit-best-input').value.trim(),bare_minimum_definition:document.getElementById('edit-bare-input').value.trim(),frequency,custom_interval_days:frequency==='weekly'?7:interval,target_completions:target,expected_completions:nextTarget,remaining_completions:Math.max(0,nextTarget-(Number(r.days_done)||0)),next_due_date:nextDueFor({...r,start_date:document.getElementById('edit-start-input').value,frequency,custom_interval_days:frequency==='weekly'?7:interval}),updated_at:Date.now(),recent_update:'Goal details updated'});document.getElementById('edit-goal-form').classList.add('hidden');showToast('Goal updated.')}catch(e){console.error(e);showToast('Could not update the goal.')}finally{b.disabled=false}});

document.addEventListener('DOMContentLoaded',()=>{restoreSession();setCopy();document.getElementById('goal-start-date').value=START_DATE;updateChallengeSummary();lucide.createIcons();initFirebase();});
</script>
